<!doctype html><html><head><meta charset="utf-8"><meta name="na-exclude" content="1"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#e9dcc3}
*{box-sizing:border-box}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans CJK TC",sans-serif}
.paper{position:absolute;filter:drop-shadow(0 6px 0 rgba(60,40,20,.18)) drop-shadow(0 14px 18px rgba(60,40,20,.28))}
.tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
.serif{font-family:"Noto Serif CJK TC",serif}
</style></head><body><div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .22  0 0 0 .35 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
</defs></svg>
<script>
// ===== 共用工具 =====
const P={kraft:'#e9dcc3',cream:'#fbf6ea',ink:'#2b2622',red:'#d9532b',orange:'#f0a33a',green:'#2f7d5b',teal:'#6fb3a8',pink:'#e98a9b',blue:'#5b86c5',yellow:'#f4cf5d'};
const FPS=12; let F=0;
function rnd(s){const x=Math.sin(s*127.1+F*311.7)*43758.5453;return x-Math.floor(x)}       // 每格不同 → 停格抖動
function jit(id,a=1.2){return `translate(${(rnd(id)-.5)*a*2}px,${(rnd(id+9)-.5)*a*2}px) rotate(${(rnd(id+3)-.5)*a*.6}deg)`}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const back=k=>{k=clamp(k);const c=1.70158,c3=c+1;return 1+c3*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const span=(t,a,b)=>clamp((t-a)/(b-a));
// 紙片：帶紙紋與雙層陰影的 SVG 形狀
function sheet(x,y,w,h,col,id,extra='',inner='',rot=0,op=1){
  const torn=`M0,4 ${Array.from({length:12},(_,i)=>`L${(i+1)*w/12},${(i%2?0:6)+rnd(id+i)*3}`).join(' ')} L${w},${h-4} ${Array.from({length:12},(_,i)=>`L${w-(i+1)*w/12},${h-(i%2?0:5)-rnd(id+i+40)*3}`).join(' ')} Z`;
  return `<div class="paper" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${jit(id)} rotate(${rot}deg);opacity:${op};${extra}">
  <svg width="${w}" height="${h}" style="position:absolute;inset:0"><path d="${torn}" fill="${col}"/><path d="${torn}" fill="${col}" filter="url(#grain)"/></svg>
  <div style="position:absolute;inset:0">${inner}</div></div>`}
function bg(col=P.kraft){return `<div style="position:absolute;inset:0;background:${col}"></div><svg class="tex" width="1280" height="720"><rect width="1280" height="720" fill="#fff" filter="url(#grain)"/></svg>`}
function caption(txt,t0,t,y=626){ if(t<t0) return ''; const k=back(span(t,t0,t0+.35));
  const w=[...txt].reduce((s,c)=>s+(c.charCodeAt(0)>255?33:18),0)+90;
  return sheet(640-w/2, y+(1-k)*60, w, 66, P.ink, 900+txt.length, '', `<div style="color:#fbf6ea;font-weight:900;font-size:32px;line-height:66px;text-align:center;white-space:nowrap">${txt}</div>`)}
// 剪紙人（簡化：頭、身體、手臂、書）
function person(x,y,mood,id,calm=0){ const bob=calm?0:Math.sin(F*1.3)*4; const eye=mood>0.5?'M-8,-2 l6,4 M8,-2 l-6,4':'M-9,0 h6 M3,0 h6';
  return `<div class="paper" style="left:${x}px;top:${y+bob}px;transform:${jit(id,1)}"><svg width="220" height="260" viewBox="-110 -60 220 260">
   <path d="M-70,200 Q-75,70 0,60 Q75,70 70,200 Z" fill="${P.blue}"/><path d="M-70,200 Q-75,70 0,60 Q75,70 70,200 Z" fill="${P.blue}" filter="url(#grain)"/>
   <circle cx="0" cy="10" r="46" fill="#f2c9a0"/><circle cx="0" cy="10" r="46" fill="#f2c9a0" filter="url(#grain)"/>
   <path d="M-46,0 Q-40,-44 0,-40 Q44,-44 46,0 Q20,-18 -46,0Z" fill="${P.ink}"/>
   <path d="${eye}" stroke="${P.ink}" stroke-width="4" stroke-linecap="round" transform="translate(0,12)"/>
   <path d="M-12,34 Q0,${mood>0.5?28:40} 12,34" stroke="${P.ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
   ${mood>0.5?`<path d="M30,-30 q8,-10 16,0 q8,10 16,0" stroke="${P.red}" stroke-width="4" fill="none"/>`:''}
  </svg></div>`}
function gauge(x,y,val,label,id,note=''){ const col=val>=65?P.red:val>=35?P.orange:P.green; const a=Math.PI*(1-val/100);
  return sheet(x,y,300,200,P.cream,id,'',`<svg width="300" height="200" style="position:absolute;left:0;top:0">
   <path d="M40,160 A110,110 0 0 1 260,160" stroke="#e2d6bf" stroke-width="26" fill="none"/>
   <path d="M40,160 A110,110 0 0 1 ${150+110*Math.cos(a)},${160-110*Math.sin(a)}" stroke="${col}" stroke-width="26" fill="none"/>
   <line x1="150" y1="160" x2="${150+85*Math.cos(a)}" y2="${160-85*Math.sin(a)}" stroke="${P.ink}" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="160" r="12" fill="${P.ink}"/>
   <text x="150" y="128" text-anchor="middle" font-size="44" font-weight="900" fill="${P.ink}" font-family="Noto Sans CJK TC">${Math.round(val)}</text>
   <text x="150" y="192" text-anchor="middle" font-size="18" fill="#6a5d50" font-family="Noto Sans CJK TC">${label}</text>
   ${note?`<text x="282" y="26" text-anchor="end" font-size="15" fill="#9a8b78" font-family="Noto Sans CJK TC">${note}</text>`:''}</svg>`)}

// ===== 場景 =====
const SC={};
// S1 開場 6s：紙層視差滑入 + 打字機 + slogan
SC.hook=t=>{let h=bg('#2b2622');
  const lay=[[P.teal,-40,520,1400,260,.6],[P.green,-60,580,1440,220,.9],[P.ink,-80,640,1500,160,1.2]];
  lay.forEach(([c,x,y,w,hh,sp],i)=>{const k=ease(span(t,.1*i,.9+.1*i));h+=sheet(x-(1-k)*200*sp,y+(1-k)*200,w,hh,c,10+i)});
  const q='你上一次讀完一整頁，沒有分心，是什麼時候？'; const n=Math.floor(clamp((t-.4)/2.0)*q.length);
  h+=`<div class="serif" style="position:absolute;top:170px;width:100%;text-align:center;color:#fbf6ea;font-size:44px;font-weight:700;transform:${jit(1,.8)}">${q.slice(0,n)}<span style="opacity:${F%2}">▍</span></div>`;
  if(t>2.9){const k=back(span(t,2.9,3.3)); h+=sheet(250,300+(1-k)*-80,780,110,P.red,20,'',`<div class="serif" style="color:#fbf6ea;font-size:52px;font-weight:900;text-align:center;line-height:110px">你沒有不專心，是網頁太吵了。</div>`,-1.5)}
  if(t>4.0){const k=back(span(t,4.0,4.4)); h+=sheet(390,440,500,62,P.cream,21,`transform:scale(${k}) ${jit(21)}`,`<div style="color:${P.ink};font-size:26px;font-weight:900;text-align:center;line-height:62px">NeuroAdaptive AI 瀏覽器擴充 Demo</div>`,1)}
  return h};
// S2 概念 10s：剪紙人讀吵鬧網頁 → 軌跡 → 儀表（示意）→ 撕掉干擾
SC.concept=t=>{let h=bg();
  // 紙做的瀏覽器
  h+=sheet(80,70,640,470,P.cream,30,'',`<div style="position:absolute;left:0;right:0;top:0;height:40px;background:#d8ccb4;border-radius:4px 4px 0 0"></div>
    <div style="position:absolute;left:18px;top:12px;width:14px;height:14px;border-radius:50%;background:${P.red}"></div><div style="position:absolute;left:40px;top:12px;width:14px;height:14px;border-radius:50%;background:${P.yellow}"></div>
    ${[0,1,2,3,4,5,6].map(i=>`<div style="position:absolute;left:190px;top:${80+i*34}px;width:${240-(i%3)*30}px;height:12px;background:#cdbfa6;border-radius:6px"></div>`).join('')}
    <div style="position:absolute;left:190px;top:56px;width:260px;height:18px;background:${P.ink};border-radius:4px"></div>`);
  const peel=span(t,6.6,8.4);
  const ads=[[100,120,150,110,P.pink,'限時 1 折!'],[510,110,180,150,P.yellow,'只剩 3 件'],[110,330,160,150,P.teal,'▶ 自動播放'],[500,330,190,140,P.orange,'HOT 排行'],[300,440,230,80,P.red,'訂閱領 100 元']];
  ads.forEach(([x,y,w,hh,c,tx],i)=>{const flap=Math.sin(F*2.1+i)*7*(1-peel); const k=ease(span(peel,i*.12,i*.12+.5));
    if(k<1) h+=sheet(x+k*(i%2?700:-700),y-k*260,w,hh,c,40+i,`transform-origin:${i%2?'0 0':'100% 0'};transform:${jit(40+i,2)} rotate(${flap+k*(i%2?40:-40)}deg) scaleY(${1-k*.5})`,`<div style="color:#fff;font-weight:900;font-size:24px;text-align:center;line-height:${hh}px;text-shadow:0 2px 0 rgba(0,0,0,.2)">${tx}</div>`)});
  // 剪紙人
  h+=person(820,330,peel<.6?1:0,60,peel>.6);
  // 滑鼠軌跡（紙繩）
  if(t>1.2&&t<7){const n=Math.floor(span(t,1.2,4.5)*28); let d='M400,300'; for(let i=0;i<n;i++){d+=` L${120+((i*197)%560)},${110+((i*131)%400)}`}
    h+=`<svg style="position:absolute;left:80px;top:0" width="720" height="560"><path d="${d}" stroke="${P.red}" stroke-width="5" fill="none" stroke-dasharray="10 7" stroke-linecap="round" filter="url(#rough)" transform="translate(-80,0)"/></svg>`}
  // 儀表：30→78→32（示意）
  const val=t<1.5?30:t<5.5?30+48*ease(span(t,1.5,5.2)):t<7?78:78-46*ease(span(t,7,9));
  h+=gauge(930,60,val,'注意力負荷',70,'示意');
  if(!window.NOCAP&&t>1.3&&t<6.6) h+=caption('滑鼠的速度、方向、來回捲動 → 注意力負荷',1.3,t);
  if(!window.NOCAP&&t>=6.6) h+=caption('負荷偏高時，把干擾一張一張撕下來',6.6,t);
  return h};
// S3 功能快閃 7s
SC.features=t=>{let h=bg('#f1e6cf');
  const it=[['👁','即時偵測','滑鼠微行為 → 0–100 指標',P.blue],['🔔','溫和提醒','持續偏高才提示，可按稍後',P.orange],['✂','一鍵專注','分層撕掉干擾、可隨時關閉',P.green],['🔒','本機運算','不上傳、不存軌跡',P.ink]];
  it.forEach(([ic,a,b,c],i)=>{const t0=.3+i*1.4; if(t<t0) return; const k=back(span(t,t0,t0+.45));
    h+=sheet(70+i*290,170-(1-k)*400,260,330,c,80+i,'',`<div style="text-align:center;color:#fbf6ea;padding-top:40px"><div style="font-size:70px">${ic}</div><div style="font-size:38px;font-weight:900;margin-top:16px">${a}</div><div style="font-size:19px;margin:14px 18px 0;line-height:1.5">${b}</div></div>`,(i%2?2:-2))});
  return h};
// S4 聲明 6s
SC.disclaimer=t=>{let h=bg('#2b2622'); const k=back(span(t,.1,.6));
  h+=sheet(190,190-(1-k)*300,900,250,'#ffffff',90,'',`<div class="serif" style="text-align:center;color:${P.ink};font-size:46px;font-weight:900;padding-top:58px">自我覺察的輔助工具，不做醫療診斷。</div><div style="text-align:center;color:#6a5d50;font-size:22px;margin-top:22px">指標為原型的透明規則，尚未經臨床驗證；所有資料只在本機計算。</div>`);
  return h};
// S5 結尾 7s
SC.end=t=>{let h=bg();
  [[P.teal,0,560,1280,160],[P.green,0,610,1280,110]].forEach(([c,x,y,w,hh],i)=>{const k=ease(span(t,i*.15,.8+i*.15));h+=sheet(x-20,y+(1-k)*160,w+40,hh,c,95+i)});
  const k=back(span(t,.3,.8)); h+=`<div class="paper" style="left:560px;top:${70+(1-k)*-200}px;transform:${jit(97)}"><svg width="160" height="160"><circle cx="80" cy="80" r="74" fill="${P.blue}"/><circle cx="80" cy="80" r="74" fill="${P.blue}" filter="url(#grain)"/><circle cx="80" cy="80" r="30" fill="#fbf6ea"/></svg></div>`;
  if(t>.8){const k2=back(span(t,.8,1.2));h+=`<div style="position:absolute;top:250px;width:100%;text-align:center;font-size:62px;font-weight:900;color:${P.ink};transform:scale(${k2}) ${jit(98,.8)}">NeuroAdaptive AI</div>`}
  if(t>1.6){const k3=back(span(t,1.6,2.0));h+=sheet(180,360,920,100,P.red,99,`transform:scaleX(${k3}) ${jit(99)}`,`<div class="serif" style="color:#fbf6ea;font-size:44px;font-weight:900;text-align:center;line-height:100px">讓網頁配合你的大腦，而不是反過來。</div>`)}
  if(t>2.6) h+=`<div style="position:absolute;top:650px;width:100%;text-align:center;color:#fbf6ea;font-size:22px;font-weight:700">NeuroAdaptive AI 專題團隊 ・ Chrome 擴充功能 Demo v0.2</div>`;
  return h};
// 分割畫面背景（靜態紙框）
SC.splitbg=t=>{let h=bg('#2b2622');
  h+=sheet(22,92,624,370,P.red,110)+sheet(634,92,624,370,P.green,111);
  return h};
SC.cap=t=>caption(window.CAP,0,9);

// ===== v2 scenes =====
const node=(x,y,w,h,col,id,on,title,sub)=>sheet(x,y,w,h,on?col:'#4a423b',id,`opacity:${on?1:.55}`,`<div style="padding:14px 18px;color:#fbf6ea"><div style="font-size:21px;font-weight:900;white-space:nowrap">${title}</div><div style="font-size:13px;margin-top:6px;opacity:.9">${sub}</div></div>`);
SC.flow=t=>{let h=bg('#2b2622');
  h+=`<div style="position:absolute;left:36px;top:24px;color:#f4cf5d;font-size:20px;font-weight:900;letter-spacing:.1em">STEP 1 ・ v0.1 起點</div>`;
  const N=[['Go/No-Go 小遊戲','Browser game · 20 trials',P.blue],['10 個滑鼠特徵','RT variability · direction · efficiency',P.teal],['負荷分數＋儀表板','Attention-load score + dashboard',P.orange]];
  N.forEach(([a,b,c],i)=>{const on=t>1+i*3.2; const k=back(span(t,1+i*3.2,1.4+i*3.2)); h+=`<div style="position:absolute;left:0;top:0;transform:scale(${on?.96+.04*k:.96});transform-origin:150px ${130+i*150}px">`+node(28,80+i*150,280,110,c,300+i,on,a,b)+'</div>';
    if(i<2) h+=`<svg style="position:absolute;left:150px;top:${195+i*150}px" width="40" height="40"><path d="M20,2 L20,30 M10,22 L20,34 L30,22" stroke="${on?'#fbf6ea':'#6b625a'}" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`});
  h+=sheet(330,60,930,540,'#3a332d',310); // frame for real footage
  return h};
SC.bridge=t=>{let h=bg('#2b2622'); const k=back(span(t,.2,.6)), k2=back(span(t,1.6,2.0));
  h+=sheet(170,170,420,170,P.blue,320,`transform:scale(${k}) ${jit(320)}`,`<div style="text-align:center;color:#fbf6ea;padding-top:30px"><div style="font-size:52px;font-weight:900">量測</div><div style="font-size:24px">Measure</div></div>`,-2);
  if(t>1.0){const a=span(t,1.0,1.6); h+=`<svg style="position:absolute;left:600px;top:225px" width="90" height="60"><path d="M5,30 L${5+75*a},30 M${60*a},12 L${80*a},30 L${60*a},48" stroke="#f4cf5d" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`}
  if(t>1.6) h+=sheet(700,170,420,170,P.green,321,`transform:scale(${k2}) ${jit(321)}`,`<div style="text-align:center;color:#fbf6ea;padding-top:30px"><div style="font-size:52px;font-weight:900">介入</div><div style="font-size:24px">Help, in the moment</div></div>`,2);
  return h};
SC.feat5=t=>{let h=bg('#f1e6cf');
  h+=`<div style="position:absolute;left:40px;top:28px;font-size:30px;font-weight:900;color:${P.ink}">保留動作特徵＋加入瀏覽訊號 <span style="font-size:20px;color:#6a5d50">Movement features + browsing signals</span></div>`;
  const F=[['移動節奏不穩','speed CV',.30,P.red],['突發甩動','sudden flicks',.28,P.orange],['來回捲動 ≥120px','back-and-forth scroll',.20,P.pink],['方向急轉','direction changes',.12,P.blue],['速度變異','speed SD',.10,P.teal]];
  F.forEach(([a,b,w,c],i)=>{const t0=.3+i*.5; if(t<t0) return; const k=back(span(t,t0,t0+.4));
    h+=sheet(40,100+i*84-(1-k)*30,760,70,P.cream,330+i,`opacity:${clamp(k)}`,`<div style="display:flex;align-items:center;height:70px;padding:0 20px;gap:16px"><div style="width:${w*900}px;height:26px;background:${c};border-radius:4px"></div><div style="font-size:24px;font-weight:900;color:${P.ink}">${a}</div><div style="font-size:16px;color:#6a5d50">${b}</div><div style="margin-left:auto;font-size:22px;font-weight:900;color:${P.ink}">×${w.toFixed(2)}</div></div>`)});
  if(t>3.2){const k=back(span(t,3.2,3.6)); h+=sheet(850,120,390,300,P.green,340,`transform:scale(${k}) ${jit(340)}`,`<div style="color:#fbf6ea;text-align:center;padding:34px 20px"><div style="font-size:58px">🧭</div><div style="font-size:30px;font-weight:900;margin-top:10px">個人基準線</div><div style="font-size:19px;margin-top:10px;line-height:1.5">前 25 秒先校準<br>只跟你自己比，不跟別人比<br><span style="opacity:.8">Your own baseline only</span></div></div>`,2)}
  h+=`<div style="position:absolute;left:40px;top:530px;font-size:17px;color:#6a5d50">權重沿用 v0.1 指標（人工設定、尚未用資料校正）・Weights carried over from v0.1 (hand-set, not yet data-calibrated)</div>`;
  return h};
SC.scripted=t=>{let h=bg('#f1e6cf'); const D=window.SD, dur=window.SDUR||14;
  h+=sheet(250,14,780,58,P.ink,350,'',`<div style="color:#fbf6ea;text-align:center;line-height:58px;font-size:24px;font-weight:900">程式模擬軌跡，非受試者數據 ・ Scripted input, not human data</div>`);
  [['restless','躁動輸入 Restless',P.red,40],['steady','平穩輸入 Steady',P.green,660]].forEach(([k,title,c,x],j)=>{
    const d=D[k], fr=clamp(t/(dur*.85)), n=Math.floor(fr*d.points.length), sc=.42;
    let path=''; d.points.slice(0,n).forEach(([px,py],i)=>path+=(i?'L':'M')+(px*sc+10).toFixed(1)+','+(py*sc+10).toFixed(1));
    const si=Math.min(9,Math.floor(fr*10)), val=d.series[si];
    h+=sheet(x,92,580,430,P.cream,360+j,'',`<div style="position:absolute;left:18px;top:12px;font-size:24px;font-weight:900;color:${P.ink}">${title}</div>
     <svg style="position:absolute;left:10px;top:52px" width="560" height="320"><rect x="10" y="10" width="538" height="302" fill="#efe6d2" rx="6"/><path d="${path}" stroke="${c}" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity=".85"/></svg>
     <div style="position:absolute;left:20px;right:20px;top:382px;height:30px;background:#e2d6bf;border-radius:4px"><div style="width:${val}%;height:100%;background:${c};border-radius:4px"></div></div>
     <div style="position:absolute;right:24px;top:338px;font-size:34px;font-weight:900;color:${c}">${val}</div>
     <div style="position:absolute;left:20px;top:348px;font-size:15px;color:#6a5d50">第 ${si+1} 秒 / 10 秒</div>`)});
  h+=`<div style="position:absolute;left:40px;top:540px;font-size:17px;color:#6a5d50">分數量尺 0–100，越高＝動作越躁動・同一頁面、同一設定，擴充功能即時計算・Score 0–100, higher = more restless movement</div>`;
  return h};
SC.control=t=>{let h=bg('#f1e6cf');
  const I=[['📷','不需要鏡頭','No camera'],['🖱','不需額外硬體','No extra hardware'],['↩','一鍵還原','One-click restore'],['🔒','資料留在本機','Data stays local']];
  I.forEach(([ic,a,b],i)=>{const t0=.2+i*.6; if(t<t0) return; const k=back(span(t,t0,t0+.4));
    h+=sheet(60+i*295,150-(1-k)*300,270,300,[P.blue,P.teal,P.green,P.ink][i],370+i,'',`<div style="text-align:center;color:#fbf6ea;padding-top:44px"><div style="font-size:66px">${ic}</div><div style="font-size:32px;font-weight:900;margin-top:16px">${a}</div><div style="font-size:18px;margin-top:8px;opacity:.85">${b}</div></div>`,(i%2?2:-2))});
  return h};
SC.next=t=>{let h=bg();
  h+=`<div style="position:absolute;left:60px;top:40px;font-size:36px;font-weight:900;color:${P.ink}">下一步 Next</div>`;
  [['👥','請同學小規模試用','Classmate trial (planned)'],['⚖','用回饋與資料校正權重','Tune the weights with real feedback']].forEach(([ic,a,b],i)=>{const t0=.3+i*.8; if(t<t0) return; const k=back(span(t,t0,t0+.4));
    h+=sheet(80+i*570,130-(1-k)*200,520,240,[P.blue,P.orange][i],380+i,'',`<div style="color:#fbf6ea;padding:34px 30px"><div style="font-size:56px">${ic}</div><div style="font-size:32px;font-weight:900;margin-top:12px">${a}</div><div style="font-size:19px;margin-top:8px;opacity:.9">${b}</div></div>`,(i?2:-2))});
  return h};
SC.disc2=t=>{let h=bg('#2b2622'); const k=back(span(t,.1,.5));
  h+=sheet(160,150-(1-k)*300,960,250,'#ffffff',390,'',`<div class="serif" style="text-align:center;color:${P.ink};font-size:46px;font-weight:900;padding-top:52px">自我覺察的輔助工具，不做醫療診斷。</div><div style="text-align:center;color:#6a5d50;font-size:22px;margin-top:20px">Not a medical or diagnostic tool ・ 指標為原型規則，尚未經資料驗證</div>`);
  return h};
SC.end2=t=>{let h=SC.end(Math.min(t,2.5)).replace(/NeuroAdaptive AI 專題團隊 ・ Chrome 擴充功能 Demo v0.2/,'歡迎來攤位試玩 ・ Come try it at our booth');
  if(t>2.6) h+=`<div style="position:absolute;top:470px;width:100%;text-align:center;color:#4a423b;font-size:19px;line-height:1.7">旁白：AI 合成語音 ・ Narration: AI-generated voice (Microsoft Edge TTS, en-US-AndrewNeural)<br>配樂：本團隊以程式自行合成的原創配樂 ・ Music: original, procedurally generated</div>`;
  return h};

window.renderFrame=(scene,t)=>{F=Math.floor(t*FPS); document.getElementById('stage').innerHTML=SC[scene](Math.floor(t*FPS)/FPS)};
</script></body></html>
